# Sample nginx reverse-proxy config for CR Process Automation.
#
# The WSGI server (Gunicorn on Linux, Waitress on Windows / Linux VM) listens
# on 127.0.0.1:8000. Start it with:
#
#     ./start.sh --host 127.0.0.1 --port 8000        # Linux / Linux VM
#     start.bat --host 127.0.0.1 --port 8000         # Windows
#
# Then point `upstream cr_app` at that address. Static files are served here by
# nginx for speed; WhiteNoise still serves them if this block is omitted.
#
# Replace the two `alias` paths with your deploy location. On a Linux VM inside
# a Windows host, nginx may run either inside the guest (as below) or on the
# Windows host proxying to the guest's IP/port-forwarded address - in that case
# change the upstream server to the guest IP, e.g. `server 192.168.56.10:8000;`.

upstream cr_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;                 # or your hostname, e.g. cr-app.internal

    # Allow large report uploads / downloads.
    client_max_body_size 100M;

    # --- Static files (collected by `manage.py collectstatic`) -------------
    location /static/ {
        alias /opt/cr_process_automation/cr_process_automation/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- Generated / media files -------------------------------------------
    location /media/ {
        alias /opt/cr_process_automation/cr_process_automation/media/;
        access_log off;
    }

    # --- Application -------------------------------------------------------
    location / {
        proxy_pass http://cr_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Automation tasks can be long-running; keep the connection generous.
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering off;
    }
}

