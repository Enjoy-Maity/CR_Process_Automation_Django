{% extends 'dashboard/base_module.html' %}
{% block module_content %}
<div class="content-card compact-content-card">
    <div class="page-head compact-page-head">
        <h2 class="module-page-title compact-module-title">NIAM Credentials</h2>
    </div>

    <div class="region-filter-panel" style="margin-bottom:16px;padding:14px;border:1px solid #d5dde8;border-radius:10px;background:#f7f9fc;">
        <div style="margin-bottom:12px;">
            <span class="cr-history-filter-label">
                Note:- Update your NIAM OLM ID and NIAM Password. Only you can change your own credentials.
            </span>
        </div>

        <div id="niam-cred-status" class="hidden" style="margin-bottom:12px;padding:10px 12px;border-radius:8px;font-weight:600;"></div>

        <form id="niam-credentials-form" method="post" action="{% url 'update_niam_credentials' %}" novalidate style="max-width:520px;">
            {% csrf_token %}

            <div style="margin-bottom:14px;">
                <label for="id_niam_olm_id" style="font-weight:700;display:block;margin-bottom:6px;">NIAM OLM ID</label>
                <input type="text" id="id_niam_olm_id" name="niam_olm_id" class="niam-cred-input"
                       value="{{ niam_olm_id }}" maxlength="100" autocomplete="off"
                       placeholder="Enter your NIAM OLM ID" required
                       style="width:100%;padding:9px 10px;border:1px solid #c5d0de;border-radius:8px;">
                <div class="niam-cred-error" data-field="niam_olm_id" style="color:#b42318;font-size:12px;margin-top:4px;"></div>
            </div>

            <div style="margin-bottom:14px;">
                <label for="id_niam_password" style="font-weight:700;display:block;margin-bottom:6px;">NIAM Password</label>
                <input type="password" id="id_niam_password" name="niam_password" class="niam-cred-input"
                       maxlength="128" autocomplete="new-password"
                       placeholder="{% if niam_password_set %}Enter new NIAM password{% else %}Enter your NIAM password{% endif %}"
                       required
                       style="width:100%;padding:9px 10px;border:1px solid #c5d0de;border-radius:8px;">
                <div class="niam-cred-error" data-field="niam_password" style="color:#b42318;font-size:12px;margin-top:4px;"></div>
                <div style="color:#5b6b7c;font-size:12px;margin-top:4px;">Minimum 8 characters, must include at least one letter and one digit.</div>
            </div>

            <div style="margin-bottom:16px;">
                <label for="id_confirm_niam_password" style="font-weight:700;display:block;margin-bottom:6px;">Confirm NIAM Password</label>
                <input type="password" id="id_confirm_niam_password" name="confirm_niam_password" class="niam-cred-input"
                       maxlength="128" autocomplete="new-password"
                       placeholder="Re-enter your NIAM password" required
                       style="width:100%;padding:9px 10px;border:1px solid #c5d0de;border-radius:8px;">
                <div class="niam-cred-error" data-field="confirm_niam_password" style="color:#b42318;font-size:12px;margin-top:4px;"></div>
            </div>

            <div style="display:flex;gap:12px;align-items:center;">
                <button type="submit" id="niam-cred-save-btn" class="action-btn compact-btn apply-filter-btn">Save Changes</button>
                <span id="niam-cred-saving" class="text-muted hidden">Saving...</span>
            </div>
        </form>
    </div>
</div>

<script>
(function () {
    const form = document.getElementById('niam-credentials-form');
    const statusBox = document.getElementById('niam-cred-status');
    const saveBtn = document.getElementById('niam-cred-save-btn');
    const savingLabel = document.getElementById('niam-cred-saving');
    const UPDATE_URL = '{% url "update_niam_credentials" %}';

    function getCookie(name) {
        const value = '; ' + document.cookie;
        const parts = value.split('; ' + name + '=');
        if (parts.length === 2) return parts.pop().split(';').shift();
        return '';
    }

    function clearErrors() {
        document.querySelectorAll('.niam-cred-error').forEach(el => { el.textContent = ''; });
        statusBox.classList.add('hidden');
        statusBox.textContent = '';
    }

    function showStatus(ok, message) {
        statusBox.textContent = message;
        statusBox.style.color = ok ? '#067647' : '#b42318';
        statusBox.style.background = ok ? '#ecfdf3' : '#fef3f2';
        statusBox.style.border = ok ? '1px solid #abefc6' : '1px solid #fecdca';
        statusBox.classList.remove('hidden');
    }

    function showFieldErrors(errors) {
        if (!errors) return;
        Object.keys(errors).forEach(function (field) {
            const box = document.querySelector('.niam-cred-error[data-field="' + field + '"]');
            if (box && errors[field] && errors[field].length) {
                box.textContent = errors[field][0];
            }
        });
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearErrors();

        const olmId = document.getElementById('id_niam_olm_id').value.trim();
        const password = document.getElementById('id_niam_password').value;
        const confirm = document.getElementById('id_confirm_niam_password').value;

        if (!olmId || !password || !confirm) {
            showStatus(false, 'Please fill in all fields.');
            return;
        }

        saveBtn.disabled = true;
        savingLabel.classList.remove('hidden');

        try {
            const response = await fetch(UPDATE_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({
                    niam_olm_id: olmId,
                    niam_password: password,
                    confirm_niam_password: confirm,
                }),
            });

            let data = {};
            try { data = await response.json(); } catch (err) { data = {}; }

            if (!response.ok || !data.ok) {
                showFieldErrors(data.errors);
                showStatus(false, data.message || 'Failed to update NIAM credentials.');
                return;
            }

            showStatus(true, data.message || 'NIAM credentials updated successfully.');
            document.getElementById('id_niam_password').value = '';
            document.getElementById('id_confirm_niam_password').value = '';
        } catch (err) {
            showStatus(false, 'Network error. Please try again.');
        } finally {
            saveBtn.disabled = false;
            savingLabel.classList.add('hidden');
        }
    });
})();
</script>
{% endblock %}
