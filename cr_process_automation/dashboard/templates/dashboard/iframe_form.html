<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Provide Authenticator Code</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px; 
            background: #ffffff; 
            color: #333;
            margin: 0;
        }
        h3 { margin-top: 0; font-size: 18px; color: #1a1a1a; }
        p.text-muted { color: #666; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-control { 
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box; 
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            letter-spacing: 2px;
        }
        .btn { 
            background: #0056b3; /* Adjust to match your dashboard's primary color */
            color: white; 
            padding: 10px 15px; 
            border: none; 
            border-radius: 4px;
            cursor: pointer; 
            width: 100%;
            font-size: 16px;
            font-weight: bold;
        }
        .btn:hover { background: #004494; }
    </style>
</head>
<body>
    <h3>Action Required: Authenticator Verification</h3>
    <p class="text-muted">The automation bot is paused. Please enter the 6-digit authenticator code to continue.</p>
    
    <form method="POST" action="">
        {% csrf_token %}
        {{ form.as_p }} 
        <button type="submit" class="btn">Submit & Resume Task</button>
    </form>
</body>
</html>
