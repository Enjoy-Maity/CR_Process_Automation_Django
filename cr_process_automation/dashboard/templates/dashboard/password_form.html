<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enter Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .form-container {
            max-width: 360px;
            margin: 0 auto;
        }
        h3 { margin-top: 0; }
        .form-control {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: #0067b8;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }
        .btn:hover { background: #005da6; }
        .errorlist {
            color: #d13438;
            font-size: 13px;
            list-style: none;
            padding: 0;
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h3>Enter your ITSM Password</h3>
        <p>The task is waiting for your ITSM Password to continue.</p>

        <form method="POST" action="">
            {% csrf_token %}

            {{ form.task_id }}

            {% if form.password.errors %}
                <ul class="errorlist">
                    {% for error in form.password.errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            {% endif %}

            {{ form.password }}

            <button type="submit" class="btn">Submit Password</button>
        </form>
    </div>
</body>
</html>
