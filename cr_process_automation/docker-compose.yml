services:
  db-master:
    image: postgres:16
    container_name: db-master
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Django@123#
      POSTGRES_DB: master_db
      # Existing db_master_volume was initialised with a pgdata/ subdirectory;
      # without this the entrypoint sees a non-empty PGDATA and initdb fails.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d master_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: always
    volumes:
      - db_master_volume:/var/lib/postgresql/data
      - ./init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh:ro

  db-replica:
    image: postgres:16
    container_name: db-replica
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Django@123#
      POSTGRES_DB: master_db
      # Must match the layout of the existing db_replica_volume (pgdata/ subdir).
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    depends_on:
      db-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d master_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: always
    entrypoint: ["/init-replica.sh"]
    volumes:
      - db_replica_volume:/var/lib/postgresql/data
      - ./init-replica.sh:/init-replica.sh:ro

volumes:
  db_master_volume:
  db_replica_volume:
